name: Examples

# Proof that an outside host can embed ggraphic: the examples install the packages from tarballs
# packed in this run, with npm, outside the pnpm workspace.
on:
  push:
    branches: [main]
    paths: ['packages/**', 'examples/**', '.github/workflows/examples.yml']
  pull_request:
    paths: ['packages/**', 'examples/**', '.github/workflows/examples.yml']

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-react:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/vite-react
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Build the packages
        working-directory: .
        run: |
          pnpm install --frozen-lockfile --filter "@ggraphic/editor..." --filter "@ggraphic/brand-default..."
          pnpm --filter "@ggraphic/editor..." --filter "@ggraphic/brand-default..." build
      - run: node scripts/pack.mjs
      - run: npm install --no-audit --no-fund
      - name: tsc and vite build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
