name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Placeholders: scripts are added with the first import.
      - name: Boundary check (no brand/party-specific imports or strings)
        run: 'echo "TODO: pnpm check:boundaries"'
      - name: Licence check (MPL-2.0 packages, AGPL-3.0 apps/studio)
        run: 'echo "TODO: pnpm check:licences"'
