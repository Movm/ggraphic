name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
        # No npm token: pnpm publishes through npm trusted publishing (OIDC, `id-token: write`),
        # which also attaches provenance. A token here, or `registry-url` on setup-node, would
        # make it skip OIDC. Each package's trusted publisher is Movm/ggraphic, release.yml.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
