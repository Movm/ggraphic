name: Feature or API change
description: Propose something new, or a change to a public API or the document format.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. For API changes, a sketch of the call site.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes a public API
        - label: Changes the stored document format
        - label: I would like to implement it
