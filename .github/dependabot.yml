version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly and few: every Dependabot PR spends CI minutes.
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
