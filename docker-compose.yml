# ggraphic Studio for self-hosting. See docs/self-hosting.md.
name: ggraphic-studio

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d studio']
      interval: 5s
      timeout: 5s
      retries: 10

  # The published image. To build it from a checkout instead, add docker-compose.build.yml.
  studio:
    image: ghcr.io/movm/ggraphic-studio:${STUDIO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@db:5432/studio
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-}
      THUMBNAIL_MAX_BYTES: ${THUMBNAIL_MAX_BYTES:-}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-}
      FONT_MAX_BYTES: ${FONT_MAX_BYTES:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      TRASH_PURGE_ENABLED: ${TRASH_PURGE_ENABLED:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_ENABLED: ${AI_ENABLED:-}
      # With COMPOSE_PROFILES=rembg in .env, the rembg service below. Compose shows the profiles to
      # this file only through that variable, not through `--profile` on the command line, and it
      # cannot look for a word in it: any non-empty COMPOSE_PROFILES sets this. rembg is this file's
      # only profile; if you add one of your own, set REMBG_URL (or REMBG_ENABLED=false) as well.
      REMBG_URL: ${REMBG_URL:-${COMPOSE_PROFILES:+http://rembg:7000}}
      REMBG_MODEL: ${REMBG_MODEL:-}
      REMBG_TIMEOUT_MS: ${REMBG_TIMEOUT_MS:-}
      REMBG_ENABLED: ${REMBG_ENABLED:-}
      ICONIFY_ENABLED: ${ICONIFY_ENABLED:-}
      ICONIFY_API_URL: ${ICONIFY_API_URL:-}
      ICONIFY_LICENCES: ${ICONIFY_LICENCES:-}
      ICONIFY_TIMEOUT_MS: ${ICONIFY_TIMEOUT_MS:-}
    volumes:
      - studio-data:/data
    networks: [default, rembg]
    # Lets OPENAI_BASE_URL point at a model server on the host (e.g. Ollama), also on Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Reachable from this machine only; expose it through a TLS reverse proxy. See docs/self-hosting.md.
    ports:
      - '127.0.0.1:${STUDIO_PORT:-8080}:8080'

  # Background removal, only with COMPOSE_PROFILES=rembg in .env: rembg with the open u2net model
  # (Apache-2.0) built in. On an internal network, so the images sent for cutting cannot leave it.
  rembg:
    image: ghcr.io/movm/ggraphic-rembg:${REMBG_VERSION:-latest}
    profiles: [rembg]
    restart: unless-stopped
    networks: [rembg]

networks:
  rembg:
    internal: true

volumes:
  db-data:
  studio-data:
