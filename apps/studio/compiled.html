  <head>
    <meta charset="UTF-8" />
    <title>ggraphic editor, compiled CSS only</title>

      /* A host rule: unlayered, so it beats the editor's layered utility of the same specificity. */
      .canvas-editor-layout {
        min-height: 321px;
      }
    </style>
  </head>
  <body style="margin: 0">
    <!-- Host markup with editor class names, outside the editor: must stay unstyled. -->

    <div id="root"></div>
    <script type="module" src="/src/gate/compiledHost.tsx"></script>
  </body>
